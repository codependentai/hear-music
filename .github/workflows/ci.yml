name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Core deps (numpy, scipy) + dev (pytest) only. The optional `visualize`
      # extra (librosa, matplotlib) is intentionally excluded — it pulls heavy
      # audio/system deps that are brittle on windows-latest, and librosa is
      # imported lazily and skipped gracefully when absent, so the full test
      # suite still runs. The visualization code path is therefore NOT covered
      # by this Windows check.
      - name: Install (core + dev)
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest
