[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-music"
version = "0.3.0"
description = "Local CLI for perceiving music, speech, and environmental sound as machine-readable artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.16",
]

[project.optional-dependencies]
visualize = [
  "librosa>=0.11",
  "matplotlib>=3.10",
]
perception = [
  "faster-whisper>=1.1",
  "mediapipe>=0.10.21",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
hear-music = "hear_music.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hear_music*"]
